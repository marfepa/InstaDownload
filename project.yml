name: InstaDownload

options:
  bundleIdPrefix: com.marfepa
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""

targets:
  InstaDownload:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: InstaDownload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marfepa.InstaDownload
        PRODUCT_NAME: InstaDownload
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: InstaDownload
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - InstaDownloadTests
      gatherCoverageData: false

  InstaDownloadTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: InstaDownloadTests
    dependencies:
      - target: InstaDownload
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marfepa.InstaDownloadTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        SWIFT_STRICT_CONCURRENCY: complete
